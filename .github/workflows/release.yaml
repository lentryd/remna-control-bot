name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action@v0
        with:
          upload-release-assets: false

      # The WebApp is embedded in the binary, so it is built before goreleaser.
      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"

      # The image is built from the Dockerfile (distroless, non-root), which builds the WebApp itself.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: tags
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,ghcr.io/${GITHUB_REPOSITORY}:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Telegram bot and WebApp for remna-control customers
